cron.enabled=false
cron.task=false
cron.api=false
cron.account=false
cron.fixedDelayMail=300000
cron.fixedDelayTask=300000
cron.fixedDelayApi=300000
cron.fixedDelayAccount=300000

# Multi-tenancy (tenant JDBC catalog is external / in-memory; see InMemoryTenantMetadataProvider)
tenant.default-id=default
tenant.header-name=X-Tenant-ID
# If false, missing header uses tenant.default-id (dev-friendly). If true, clients must send X-Tenant-ID.
tenant.required=false
# 0 = unlimited cached tenant pools; set >0 in production to cap memory (evicts non-default tenants)
tenant.cache-max-entries=0

spring.main.allow-circular-references=true
spring.freemarker.checkTemplateLocation=false

spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB

server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/json

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration