db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/desarrollo_logisticpymes
db.username=postgres
db.password=buho123

cron.enabled=false
cron.task=false
cron.api=false
cron.account=false

fixedDelayMail.in.milliseconds=300000
