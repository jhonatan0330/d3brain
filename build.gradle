plugins {
	id 'org.springframework.boot' version '2.4.1'
	id 'io.spring.dependency-management' version '1.0.10.RELEASE'
	id 'java'
	id 'war'
}

group = 'com.softure'
version = '2.0.2'
sourceCompatibility = '8'

repositories {
	mavenCentral()
	maven { url "http://jaspersoft.artifactoryonline.com/jaspersoft/third-party-ce-artifacts/" }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.1.3'
	implementation 'org.springframework.boot:spring-boot-starter-mail:2.3.4.RELEASE'

	implementation 'io.springfox:springfox-swagger2:2.9.2'
	implementation 'io.springfox:springfox-swagger-ui:2.9.2'


	implementation 'net.sf.jasperreports:jasperreports:6.16.0'
	implementation 'net.sf.jasperreports:jasperreports-chart-themes:6.16.0'
	implementation 'net.sf.barcode4j:barcode4j:2.1'
	implementation 'org.apache.xmlgraphics:batik-bridge:1.14'
	
	// implementation 'org.apache.xmlgraphics:batik-util:1.14'
	
	
	
	implementation 'commons-fileupload:commons-fileupload:1.4'
	implementation 'commons-net:commons-net:3.7'
	implementation 'org.apache.commons:commons-lang3:3.11'
	implementation 'org.apache.poi:poi:4.1.2'
	
	

	runtimeOnly 'org.postgresql:postgresql'
	
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

test {
	useJUnitPlatform()
}
