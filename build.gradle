plugins {
	id 'org.springframework.boot' version '2.6.11'
	id 'io.spring.dependency-management' version '1.0.13.RELEASE'
	id 'java'
}

group = 'com.softure'
version = '2.0.3'
sourceCompatibility = '17'

bootJar {
    mainClass = 'com.softure.logisticpymes.Sw42WebApplication'
}

repositories {
	mavenCentral()
	maven { 
		url = uri("https://jaspersoft.jfrog.io/jaspersoft/third-party-ce-artifacts/")
		allowInsecureProtocol = true
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator', version: '2.7.3'
	

	// implementation 'io.springfox:springfox-boot-starter:3.0.0'
	// implementation 'io.springfox:springfox-swagger-ui:3.0.0'

	implementation 'net.sf.jasperreports:jasperreports:6.20.0'
	implementation 'net.sf.jasperreports:jasperreports-chart-themes:6.20.0'
	implementation 'net.sf.jasperreports:jasperreports-fonts:6.20.0'
	
	implementation 'net.sf.barcode4j:barcode4j:2.1'
	implementation 'org.apache.xmlgraphics:batik-bridge:1.14'
	implementation 'com.google.zxing:core:3.4.1'
	implementation 'commons-fileupload:commons-fileupload:1.4'
	implementation 'commons-net:commons-net:3.7'
	implementation 'org.apache.commons:commons-lang3:3.11'
	implementation 'org.apache.poi:poi:4.1.2'
	
	implementation 'com.drewnoakes:metadata-extractor:2.16.0'
	
	implementation 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

test {
	useJUnitPlatform()
}
